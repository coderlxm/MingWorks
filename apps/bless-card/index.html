<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#15100c" />
    <title>囍 · 马勋豪 &amp; 张郡桐 新婚贺卡 · 表哥小明恭贺</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        background:
          radial-gradient(circle at 50% 18%, rgba(240, 201, 120, 0.16), transparent 55%),
          radial-gradient(circle at 80% 82%, rgba(235, 169, 164, 0.12), transparent 52%),
          linear-gradient(160deg, #1b130e 0%, #15100c 52%, #0e0a08 100%);
        color: #f8efe2;
        font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
        -webkit-font-smoothing: antialiased;
        overscroll-behavior: none;
      }

      #app {
        min-height: 100dvh;
      }

      .boot-shell {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        text-align: center;
      }

      .boot-card {
        width: min(100%, 360px);
        padding: 36px 24px;
        border-radius: 26px;
        border: 1px solid rgba(240, 201, 120, 0.34);
        background: linear-gradient(155deg, rgba(46, 33, 24, 0.92), rgba(20, 14, 10, 0.95));
        box-shadow: 0 24px 64px rgba(0, 0, 0, 0.55);
      }

      .boot-seal {
        width: 66px;
        height: 66px;
        margin: 0 auto 18px;
        border-radius: 999px;
        display: grid;
        place-items: center;
        font-family: 'Songti SC', 'STSong', 'Noto Serif SC', Georgia, serif;
        font-size: 28px;
        font-weight: 700;
        color: #fef3c7;
        background: radial-gradient(circle at 32% 30%, #e11d48, #881337 72%, #4c0519);
        border: 2px solid rgba(245, 208, 138, 0.72);
      }

      .boot-names {
        margin: 0 0 8px;
        font-family: 'Songti SC', 'STSong', 'Noto Serif SC', Georgia, serif;
        font-size: 24px;
        letter-spacing: 0.1em;
        color: #fdf4e3;
      }

      .boot-meta {
        margin: 0;
        font-size: 13px;
        letter-spacing: 0.18em;
        color: rgba(245, 208, 138, 0.82);
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="boot-shell">
        <div class="boot-card">
          <div class="boot-seal">囍</div>
          <p class="boot-names">马勋豪 ♥ 张郡桐</p>
          <p class="boot-meta">2026 · 11 · 28 · 昆明</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
