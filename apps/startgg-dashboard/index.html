<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#07070b">
  <meta name="robots" content="noindex,nofollow">
  <title>FTG · 比赛看板</title>
  <link rel="icon" type="image/svg+xml" sizes="any" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,800&display=swap">
  <style>
    /* 开场加载：内联样式，使用系统字体，保证在外部字体与样式到达前即可显示 */
    html{background:#07070b}
    #boot{position:fixed;inset:0;z-index:100;display:grid;place-items:center;overflow:hidden;background:#07070b;color:#f4f4f8;font:italic 900 16px/1 "Avenir Next Condensed","Arial Narrow",-apple-system,"PingFang SC",sans-serif}
    #boot.is-leaving{pointer-events:none;animation:boot-fade .3s ease .5s forwards}
    .boot-side{position:absolute;top:-10%;bottom:-10%;width:60%;transform:skewX(-12deg)}
    .boot-p1{left:-10%;background:linear-gradient(90deg,#ff3d5a0a,#ff3d5a2e);border-right:3px solid #ff3d5a;animation:boot-in-left .55s cubic-bezier(.2,.8,.2,1) both}
    .boot-p2{right:-10%;background:linear-gradient(270deg,#2fb8ff0a,#2fb8ff2e);border-left:3px solid #2fb8ff;animation:boot-in-right .55s cubic-bezier(.2,.8,.2,1) both}
    .boot-core{position:relative;display:flex;flex-direction:column;align-items:center;gap:22px;animation:boot-rise .5s .2s cubic-bezier(.2,.8,.2,1) both}
    .boot-bars{display:flex;align-items:center;gap:16px}
    .boot-bar{display:flex;width:clamp(96px,24vw,260px);height:12px;background:#15151e;border:1px solid #3b3b4f;transform:skewX(-20deg);overflow:hidden}
    .boot-bar.p1{justify-content:flex-end}
    .boot-bar i{display:block;width:0;height:100%;animation:boot-fill 1.6s .35s cubic-bezier(.2,.7,.2,1) forwards}
    .boot-bar.p1 i{background:linear-gradient(90deg,#ffd60a,#ff3d5a 45%)}
    .boot-bar.p2 i{background:linear-gradient(270deg,#ffd60a,#2fb8ff 45%)}
    .boot-bars b{font-size:24px;color:#ffd60a;text-shadow:0 0 18px #ffd60a80}
    .boot-mark{font-size:clamp(76px,14vw,140px);letter-spacing:-.03em;text-shadow:0 0 48px #ffd60a2e}
    .boot-mark span{color:#ffd60a}
    .boot-label{font-style:normal;font-weight:700;font-size:12px;letter-spacing:.6em;padding-left:.6em;color:#a3a3b8;animation:boot-blink 1.1s ease-in-out infinite}
    .is-leaving .boot-p1{animation:boot-out-left .5s .2s cubic-bezier(.7,0,.8,.3) forwards}
    .is-leaving .boot-p2{animation:boot-out-right .5s .2s cubic-bezier(.7,0,.8,.3) forwards}
    .is-leaving .boot-core{animation:boot-flash .45s .15s ease-in forwards}
    .is-leaving .boot-bar i{animation:boot-full .2s ease-out forwards}
    .is-leaving .boot-label{animation:none;opacity:0}
    @keyframes boot-in-left{from{transform:skewX(-12deg) translateX(-100%)}}
    @keyframes boot-in-right{from{transform:skewX(-12deg) translateX(100%)}}
    @keyframes boot-out-left{to{transform:skewX(-12deg) translateX(-110%)}}
    @keyframes boot-out-right{to{transform:skewX(-12deg) translateX(110%)}}
    @keyframes boot-rise{from{opacity:0;transform:translateY(16px)}}
    @keyframes boot-fill{to{width:86%}}
    @keyframes boot-full{from{width:86%}to{width:100%}}
    @keyframes boot-blink{50%{opacity:.25}}
    @keyframes boot-flash{to{opacity:0;transform:scale(1.18);filter:blur(4px)}}
    @keyframes boot-fade{to{opacity:0}}
    @media(prefers-reduced-motion:reduce){.boot-bar i{width:86%}}
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="boot" role="status" aria-label="正在载入比赛看板">
    <div class="boot-side boot-p1"></div>
    <div class="boot-side boot-p2"></div>
    <div class="boot-core">
      <div class="boot-bars"><span class="boot-bar p1"><i></i></span><b>VS</b><span class="boot-bar p2"><i></i></span></div>
      <div class="boot-mark">F<span>T</span>G</div>
      <div class="boot-label">LOADING</div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
